    <style>
      :root {
        /* colors */
        --primary: #89dceb;
        --secondary: #f5c27f;
        --tertiary: #f5c2e7;
        /* shades */
        --base: #1e1b1b;
        --mantle: #292426;
        --crust: #332b2f;
        --overlay: #7c6f74;
        --footer: #000000cc;
        /* text */
        --text: #c6c6c6;
        --hltext: #ffffff;
        color: var(--text);
        /* background-specific text */
        --primary-text: var(--hltext);
        --secondary-text: var(--hltext);
        --tertiary-text: var(--hltext);
        --base-text: var(--text);
        --mantle-text: var(--text);
        --crust-text: var(--text);
        --overlay-text: var(--hltext);
        --footer-text: var(--hltext);
        /* fonts — system-UI fallbacks so first paint is stable */
        --heading: "Lato", system-ui, -apple-system, "Segoe UI", sans-serif;
        --body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
        --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        font-family: var(--body);
      }
      /* dark mode */
      @media (prefers-color-scheme: dark) {
        :root {
          --primary: #89dceb;
          --secondary: #f5c27f;
          --tertiary: #f5c2e7;
          --base: #1e1b1b;
          --mantle: #292426;
          --crust: #332b2f;
          --overlay: #7c6f74;
          --footer: #00000022;
          --text: #c6c6c6;
          --hltext: #ffffff;
          color: var(--text);
          --primary-text: var(--text);
          --secondary-text: var(--text);
          --tertiary-text: var(--text);
          --base-text: var(--text);
          --mantle-text: var(--text);
          --crust-text: var(--text);
          --overlay-text: var(--hltext);
          --footer-text: var(--text);
        }
      }
      /* upstream layout rules that need theme tokens baked in */
      header#header {
        grid-template-columns: 8rem auto 8rem;
      }
      body#background {
        background: fixed center/cover var(--base);
        
        
      }
      #background-gradient {
        background: linear-gradient(
          45deg,
          color-mix(in srgb, var(--mantle) 80%, transparent), transparent, color-mix(in srgb, var(--crust) 20%, transparent)
        );
      }
      content#content {
        padding: 0 2rem;
        background: color-mix(in srgb, var(--base) 0%, transparent);
        border-left: none;
        border-right: none;
      }
      #avatar {
        
        border-radius: 1rem;
        
      }
      footer#footer a {
        color: #f5c27f;
      }
      footer#footer a:hover {
        color: #f5c2e7;
      }
    </style>
